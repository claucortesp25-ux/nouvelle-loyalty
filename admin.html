
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nouvelle | Administración</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #faf7f5;
      color: #51474b;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: min(90%, 420px);
      background: white;
      padding: 40px 30px;
      border: 1px solid #eadfe3;
      border-radius: 18px;
      text-align: center;
    }
    h1 {
      font-family: Georgia, serif;
      letter-spacing: 5px;
      font-size: 32px;
    }
    .subtitulo {
      font-size: 12px;
      letter-spacing: 2px;
    }
    h2 { margin-top: 35px; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 15px;
    }
    input { border: 1px solid #ddd; }
    button {
      background: #b9859c;
      border: none;
      color: white;
      cursor: pointer;
    }
    #mensaje { margin-top: 16px; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>NOUVELLE</h1>
    <p class="subtitulo">SPA & MEDICINA ESTÉTICA</p>
    <h2>Acceso administrativo</h2>
    <p>Ingresa tus credenciales para continuar</p>

    <form id="login">
      <input id="correo" type="email"
        placeholder="Correo electrónico"
        autocomplete="username" required>

      <input id="password" type="password"
        placeholder="Contraseña"
        autocomplete="current-password" required>

      <button type="submit">Iniciar sesión</button>
    </form>

    <p id="mensaje" role="status"></p>
  </main>

<script type="module">
  import { createClient } from
    "https://esm.sh/@supabase/supabase-js@2";

  const supabaseUrl =
    "https://xfzffvughevcdioqqwev.supabase.co";

  const supabaseKey =
    "sb_publishable_117jiDznI5BbuT9SpwQPmA_yNNHvNI6";

  const supabase = createClient(
    supabaseUrl,
    supabaseKey
  );

  const mensaje = document.getElementById("mensaje");

  document.getElementById("login")
    .addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const email =
        document.getElementById("correo").value;

      const password =
        document.getElementById("password").value;

      mensaje.textContent = "Verificando acceso...";

      const { data, error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        mensaje.textContent =
          "Correo o contraseña incorrectos.";
        return;
      }

      const { data: autorizado, error: errorAdmin } =
        await supabase.rpc("es_admin");

      if (errorAdmin || autorizado !== true) {
        await supabase.auth.signOut();
        mensaje.textContent =
          "Esta cuenta no tiene acceso administrativo.";
        return;
      }

      mensaje.textContent =
        "Acceso autorizado. Bienvenida a Nouvelle.";
      
const { data: clientas, error: errorClientas } =
  await supabase.rpc("admin_listar_clientas");

if (errorClientas) {
  mensaje.textContent =
    "Acceso autorizado, pero no se pudieron cargar las clientas.";
  console.error(errorClientas);
  return;
}

const panel = document.createElement("section");
panel.style.marginTop = "25px";

const titulo = document.createElement("h2");
titulo.textContent = "Clientas Nouvelle";
panel.appendChild(titulo);

const lista = document.createElement("div");
panel.appendChild(lista);


for (const clienta of clientas ?? []) {
  const fila = document.createElement("div");
  fila.style.marginBottom = "20px";

  const info = document.createElement("p");
  info.textContent =
    `${clienta.nombre} — ${clienta.sellos} de 10 sellos`;

  const agregar = document.createElement("button");
  agregar.textContent = "+ Agregar sello";

  const quitar = document.createElement("button");
  quitar.textContent = "− Quitar sello";
  quitar.style.marginLeft = "10px";

  async function cambiarSello(cambio) {
    agregar.disabled = true;
    quitar.disabled = true;

    try {
      const { data, error } = await supabase.rpc(
        "admin_actualizar_sellos",
        {
          p_clienta_id: clienta.id,
          p_cambio: cambio
        }
      );

      if (error) throw error;

      clienta.sellos = data;
      info.textContent =
        `${clienta.nombre} — ${data} de 10 sellos`;
    } catch (error) {
      console.error(error);
      alert("No se pudo modificar el sello.");
    } finally {
      agregar.disabled = clienta.sellos >= 10;
      quitar.disabled = clienta.sellos <= 0;
    }
  }

  agregar.addEventListener("click", () => cambiarSello(1));
  quitar.addEventListener("click", () => cambiarSello(-1));

  agregar.disabled = clienta.sellos >= 10;
  quitar.disabled = clienta.sellos <= 0;

  fila.appendChild(info);
  fila.appendChild(agregar);
  fila.appendChild(quitar);
  lista.appendChild(fila);
}

}

mensaje.insertAdjacentElement("afterend", panel);

    });

  </script>
</body>
</html>
