
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nouvelle | Administración</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 0; background: #faf7f5; color: #51474b; font-family: Arial, sans-serif; }
    .panel { width: min(92%, 540px); background: white; padding: 36px 26px; border: 1px solid #eadfe3; border-radius: 18px; text-align: center; }
    h1 { font-family: Georgia, serif; letter-spacing: 5px; font-size: 32px; }
    .subtitulo { font-size: 12px; letter-spacing: 2px; }
    h2 { margin-top: 30px; }
    input, button { width: 100%; padding: 13px; margin-top: 12px; border-radius: 8px; font-size: 15px; }
    input { border: 1px solid #ddd; }
    button { background: #b9859c; border: none; color: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.secundario { background: #eee4e8; color: #51474b; }
    .oculto { display: none; }
    .tarjeta { text-align: left; border: 1px solid #eadfe3; border-radius: 12px; padding: 16px; margin-top: 14px; overflow-wrap: anywhere; }
    .tarjeta p { margin: 6px 0; }
    .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .acciones button { font-size: 13px; }
    #mensaje, #mensajeRegistro, #mensajeLista { margin-top: 14px; }
    .codigo { font-family: monospace; font-size: 12px; overflow-wrap: anywhere; }
    .qr-contenedor { text-align: center; padding: 18px 8px; background: #fffafc; border: 1px solid #eadfe3; border-radius: 12px; margin-top: 12px; }
    .qr-contenedor canvas { display: block; margin: 12px auto; max-width: 100%; height: auto; }
    .qr-contenedor p { font-size: 13px; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>NOUVELLE</h1>
    <p class="subtitulo">SPA &amp; MEDICINA ESTÉTICA</p>
    <section id="seccionLogin">
      <h2>Acceso administrativo</h2>
      <p>Ingresa tus credenciales para continuar</p>
      <form id="login">
        <input id="correo" type="email" placeholder="Correo electrónico" autocomplete="username" required>
        <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
        <button id="botonLogin" type="submit">Iniciar sesión</button>
      </form>
    </section>
    <p id="mensaje" role="status" aria-live="polite"></p>
    <section id="administracion" class="oculto">
      <h2>Registrar nueva clienta</h2>
      <form id="formRegistro">
        <input id="nombreNueva" type="text" placeholder="Nombre de la clienta" maxlength="120" minlength="2" autocomplete="off" required>
        <button id="botonRegistrar" type="submit">+ Registrar clienta</button>
      </form>
      <p id="mensajeRegistro" role="status" aria-live="polite"></p>
      <div id="resultadoRegistro" class="oculto tarjeta"></div>
      <h2>Clientas Nouvelle</h2>
      <button id="botonActualizar" type="button" class="secundario">Actualizar lista</button>
      <p id="mensajeLista" role="status" aria-live="polite"></p>
      <div id="listaClientas"></div>
      <button id="cerrarSesion" type="button" class="secundario">Cerrar sesión</button>
    </section>
  </main>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import QRCode from "https://esm.sh/qrcode@1.5.4";

    const supabase = createClient(
      "https://xfzffvughevcdioqqwev.supabase.co",
      "sb_publishable_117jiDznI5BbuT9SpwQPmA_yNNHvNI6"
    );
    const $ = (id) => document.getElementById(id);
    const URL_TARJETA = "https://claucortesp25-ux.github.io/nouvelle-loyalty/";
    let administradora = false;

    function enlaceDeTarjeta(codigo) {
      const url = new URL(URL_TARJETA);
      url.searchParams.set("codigo", codigo);
      return url.toString();
    }

    function mostrarPanel() {
      $("seccionLogin").classList.add("oculto");
      $("administracion").classList.remove("oculto");
      $("mensaje").textContent = "Acceso autorizado. Bienvenida a Nouvelle.";
    }

    async function verificarAdministradora() {
     
const { data: clientas, error } =
  await supabase.rpc("admin_listar_clientas");

const { data: historialCanjes, error: errorCanjes } =
  await supabase.rpc("admin_listar_canjes");

if (errorCanjes) {
  console.error("Error al consultar canjes:", errorCanjes);
  $("mensajeLista").textContent =
    "No se pudo consultar el historial de recompensas.";
  return;
}
      return !error && data === true;
    }

    async function copiarEnlace(codigo, boton) {
      if (!codigo) return;
      const enlace = enlaceDeTarjeta(codigo);
      try {
        await navigator.clipboard.writeText(enlace);
        boton.textContent = "¡Enlace copiado!";
        setTimeout(() => { boton.textContent = "Copiar enlace"; }, 2500);
      } catch (error) {
        console.error(error);
        window.prompt("Copia este enlace para compartirlo:", enlace);
      }
    }

    async function alternarQR(clienta, contenedor, boton) {
      if (!contenedor.classList.contains("oculto")) {
        contenedor.classList.add("oculto");
        boton.textContent = "Ver QR";
        return;
      }
      contenedor.replaceChildren();
      const titulo = document.createElement("strong");
      titulo.textContent = "NOUVELLE";
      const subtitulo = document.createElement("p");
      subtitulo.textContent = `Tarjeta de ${clienta.nombre}`;
      const canvas = document.createElement("canvas");
      const aviso = document.createElement("p");
      aviso.textContent = "Escanea este código para consultar la tarjeta.";
      contenedor.append(titulo, subtitulo, canvas, aviso);
      contenedor.classList.remove("oculto");
      boton.textContent = "Ocultar QR";
      try {
        await QRCode.toCanvas(canvas, enlaceDeTarjeta(clienta.codigo_tarjeta), {
          width: 260,
          margin: 4,
          color: { dark: "#8d4f68", light: "#ffffff" },
          errorCorrectionLevel: "H"
        });
        const descargar = document.createElement("button");
        descargar.type = "button";
        descargar.className = "secundario";
        descargar.textContent = "Descargar QR (PNG)";
        descargar.addEventListener("click", () => {
          const a = document.createElement("a");
          a.href = canvas.toDataURL("image/png");
          a.download = `nouvelle-qr-${clienta.id}.png`;
          a.click();
        });
        contenedor.appendChild(descargar);
      } catch (error) {
        console.error(error);
        aviso.textContent = "No se pudo generar el QR. Comprueba tu conexión a internet.";
      }
    }

    async function cargarClientas() {
      if (!administradora) return;
      $("mensajeLista").textContent = "Cargando clientas...";
      
const { data: historialCanjes, error: errorCanjes } =
  await supabase.rpc("admin_listar_canjes");

if (errorCanjes) {
  console.error(errorCanjes);
  $("mensajeLista").textContent =
    "No se pudo cargar el historial de recompensas.";
  return;
}
      const { data: clientas, error } = await supabase.rpc("admin_listar_clientas");
      if (error) {
        console.error(error);
        $("mensajeLista").textContent = "No se pudieron cargar las clientas.";
        return;
      }
      const lista = $("listaClientas");
      lista.replaceChildren();
      $("mensajeLista").textContent = clientas?.length ? "" : "Aún no hay clientas registradas.";

      for (const clienta of clientas ?? []) {
        
const canjesRealizados = (historialCanjes ?? []).filter(
  (canje) =>
    Number(canje.clienta_id) === Number(clienta.id) &&
    Number(canje.ciclo) === Number(clienta.ciclo)
);

const serviciosCanjeados = new Set(
  canjesRealizados.map((canje) => Number(canje.servicio))
);
        const fila = document.createElement("div");
        fila.className = "tarjeta";
        const info = document.createElement("p");
        const codigo = document.createElement("p");
        codigo.className = "codigo";
        codigo.textContent = `Código: ${clienta.codigo_tarjeta ?? "No disponible"}`;
        const acciones = document.createElement("div");
        acciones.className = "acciones";
        const agregar = document.createElement("button");
        agregar.type = "button";
        agregar.textContent = "+ Agregar sello";
        const quitar = document.createElement("button");
        quitar.type = "button";
        quitar.textContent = "− Quitar sello";
        quitar.className = "secundario";
        function actualizarFila() {
          info.textContent = `${clienta.nombre} — ${clienta.sellos} de 10 sellos`;
          agregar.disabled = clienta.sellos >= 10;
          quitar.disabled = clienta.sellos <= 0;
        }
        async function cambiarSello(cambio) {
          agregar.disabled = true;
          quitar.disabled = true;
          try {
            const { data, error } = await supabase.rpc("admin_actualizar_sellos", {
              p_clienta_id: clienta.id, p_cambio: cambio
            });
            if (error) throw error;
            clienta.sellos = data;
          } catch (error) {
            console.error(error);
            alert("No se pudo modificar el sello. Intenta de nuevo.");
          } finally { actualizarFila(); actualizarCanjes(); }
        }
        agregar.addEventListener("click", () => cambiarSello(1));
        quitar.addEventListener("click", () => cambiarSello(-1));
        actualizarFila();
        acciones.append(agregar, quitar);
        fila.append(info, codigo, acciones);

        const compartir = document.createElement("div");
        compartir.className = "acciones";
        const copiar = document.createElement("button");
        copiar.type = "button";
        copiar.className = "secundario";
        copiar.textContent = "Copiar enlace";
        const verQR = document.createElement("button");
        verQR.type = "button";
        verQR.textContent = "Ver QR";
        const qr = document.createElement("div");
        qr.className = "qr-contenedor oculto";
        copiar.disabled = verQR.disabled = !clienta.codigo_tarjeta;
        copiar.addEventListener("click", () => copiarEnlace(clienta.codigo_tarjeta, copiar));
        verQR.addEventListener("click", () => alternarQR(clienta, qr, verQR));
        compartir.append(copiar, verQR);
        fila.append(compartir, qr);
        const recompensas = document.createElement("div");
        recompensas.style.marginTop = "16px";
        const tituloRecompensas = document.createElement("strong");
        tituloRecompensas.textContent = "Canjear recompensa";
        recompensas.appendChild(tituloRecompensas);
        const opciones = [
          { servicio: 2, descuento: 10 },
          { servicio: 5, descuento: 15 },
          { servicio: 8, descuento: 10 },
          { servicio: 10, descuento: 50 }
        ];
        const botonesCanje = [];
        let procesando = false;
        function actualizarCanjes() {
          for (const { boton, servicio } of botonesCanje) {
            
boton.disabled = procesando || clienta.sellos !== servicio || serviciosCanjeados.has(servicio);
boton.textContent = serviciosCanjeados.has(servicio)
  ? `✓ Descuento ya canjeado · Servicio ${servicio}`
  : `Canjear ${servicio === 5 ? 15 : servicio === 10 ? 50 : 10}% · Servicio ${servicio}`;

          }
        }
        for (const { servicio, descuento } of opciones) {
          const boton = document.createElement("button");
          boton.type = "button";
          boton.className = "secundario";
          boton.textContent = `Canjear ${descuento}% · Servicio ${servicio}`;
          botonesCanje.push({ boton, servicio });
          boton.addEventListener("click", async () => {
            if (procesando || clienta.sellos !== servicio) return;
            if (!confirm(`¿Confirmas que ${clienta.nombre} utilizó el ${descuento}% de descuento en su servicio ${servicio}?${servicio === 10 ? " Su tarjeta volverá a 0 sellos." : ""}`)) return;
            procesando = true;
            agregar.disabled = quitar.disabled = true;
            actualizarCanjes();
            try {
              const { data, error } = await supabase.rpc("admin_canjear_recompensa", {
                p_clienta_id: clienta.id,
                p_servicio: servicio
              });
              if (error) throw error;
              alert(`Canje del ${descuento}% registrado correctamente.${servicio === 10 ? " La tarjeta comenzó un nuevo ciclo." : ""}`);
              
serviciosCanjeados.add(servicio);

              await cargarClientas();
            } catch (error) {
              console.error(error);
              alert("No se pudo registrar el canje. Comprueba que corresponda a este servicio y que no se haya canjeado antes.");
            } finally {
              procesando = false;
              actualizarFila();
              actualizarCanjes();
            }
          });
          recompensas.appendChild(boton);
        }
        actualizarCanjes();
        fila.appendChild(recompensas);
        lista.appendChild(fila);
      }
    }

    $("login").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      $("botonLogin").disabled = true;
      $("mensaje").textContent = "Verificando acceso...";
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: $("correo").value.trim(), password: $("password").value
        });
        if (error) {
          $("mensaje").textContent = "Correo o contraseña incorrectos.";
          return;
        }
        if (!(await verificarAdministradora())) {
          await supabase.auth.signOut();
          $("mensaje").textContent = "Esta cuenta no tiene acceso administrativo.";
          return;
        }
        administradora = true;
        $("password").value = "";
        mostrarPanel();
        await cargarClientas();
      } catch (error) {
        console.error(error);
        $("mensaje").textContent = "No se pudo verificar el acceso.";
      } finally { $("botonLogin").disabled = false; }
    });

    $("formRegistro").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      if (!administradora) return;
      const nombre = $("nombreNueva").value.trim();
      if (nombre.length < 2 || nombre.length > 120) {
        $("mensajeRegistro").textContent = "Escribe un nombre válido (2 a 120 caracteres).";
        return;
      }
      $("botonRegistrar").disabled = true;
      $("mensajeRegistro").textContent = "Registrando clienta...";
      $("resultadoRegistro").classList.add("oculto");
      try {
        const { data, error } = await supabase.rpc("admin_registrar_clienta", { p_nombre: nombre });
        if (error) throw error;
        const clienta = Array.isArray(data) ? data[0] : data;
        if (!clienta) throw new Error("No se recibió la clienta registrada.");
        $("mensajeRegistro").textContent = "¡Clienta registrada correctamente!";
        const resultado = $("resultadoRegistro");
        resultado.replaceChildren();
        const titulo = document.createElement("strong");
        titulo.textContent = clienta.nombre;
        const codigo = document.createElement("p");
        codigo.className = "codigo";
        codigo.textContent = `Código de tarjeta: ${clienta.codigo_tarjeta}`;
        const sellos = document.createElement("p");
        sellos.textContent = `${clienta.sellos} de 10 sellos`;
        resultado.append(titulo, codigo, sellos);
        resultado.classList.remove("oculto");
        $("nombreNueva").value = "";
        await cargarClientas();
      } catch (error) {
        console.error(error);
        $("mensajeRegistro").textContent = "No se pudo registrar la clienta. Revisa la configuración o inténtalo de nuevo.";
      } finally { $("botonRegistrar").disabled = false; }
    });

    $("botonActualizar").addEventListener("click", cargarClientas);
    $("cerrarSesion").addEventListener("click", async () => {
      await supabase.auth.signOut();
      administradora = false;
      $("administracion").classList.add("oculto");
      $("seccionLogin").classList.remove("oculto");
      $("mensaje").textContent = "Sesión cerrada.";
      $("resultadoRegistro").classList.add("oculto");
      $("listaClientas").replaceChildren();
    });
  </script>
</body>
</html>
